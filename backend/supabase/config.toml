project_id = "spotify-booster-commercial-phase-a"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[api.tls]
enabled = true
cert_path = "./.local/tls/supabase-local.crt"
key_path = "./.local/tls/supabase-local.key"

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "https://127.0.0.1:54321"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "https://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
signing_keys_path = "./.local/auth/signing_keys.json"
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 0
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = ""

[auth.email]
enable_signup = true
enable_confirmations = false
